# llm-usage-exporter config. ${VAR} is replaced from the environment.
listen: ":9877"
# Name of the sub2api instance; added to every metric as sub2api_instance.
# Optional; set it when one Prometheus scrapes several exporters.
instance: ""
metrics_path: /metrics

database:
  # sub2api PostgreSQL. A read-only role with SELECT on accounts and proxies is enough.
  dsn: "postgres://llm_usage_exporter:${SUB2API_DB_PASSWORD}@127.0.0.1:5432/sub2api?sslmode=disable"
  reload_interval: 2m
  query_timeout: 15s

# Proxy precedence: providers.<id>.proxy > account proxy in sub2api
# (when use_account_proxy) > proxy > direct.
# Values: "" (not set), "direct", or http/https/socks5/socks5h URL.
proxy: ""
use_account_proxy: true

collect:
  concurrency: 8
  timeout: 15s          # one upstream HTTP request
  max_staleness: 1h     # stop exporting values older than this
  unsupported_retry: 6h # retry hosts without the endpoint (e.g. DeepSeek relays) this rarely

auth_blacklist:
  duration: 6h          # skip a rejected key until it changes or this expires
  status_codes: [401]

# Accounts that are not in sub2api, e.g. official DeepSeek keys.
# accounts:
#   - name: DeepSeek Cyber
#     provider: deepseek
#     api_key: ${DEEPSEEK_CYBER_KEY}

providers:
  zhipu:        { enabled: true, interval: 5m }   # GLM Coding Plan
  minimax:      { enabled: true, interval: 5m }
  kimi:         { enabled: true, interval: 5m }
  opencode_go:  { enabled: true, interval: 5m }   # minimum 5m
  command_code: { enabled: true, interval: 5m }
  cline:        { enabled: true, interval: 5m }
  deepseek:     { enabled: true, interval: 5m }   # pay-as-you-go balance
  # example: kimi: { interval: 5m, proxy: "socks5h://127.0.0.1:1080" }

# Token usage and its cost from sub2api usage_logs (needs SELECT on usage_logs).
usage:
  enabled: true
  timezone: UTC          # IANA name; hours and days start in this zone
  windows: [1, 7, 30]    # trailing windows in days for llm_usage_* per account
  hourly_buckets: 24     # llm_usage_bucket_*{granularity="hour"}
  daily_buckets: 7       # llm_usage_bucket_*{granularity="day"}
  interval: 5m           # re-read the last `lookback` this often
  lookback: 1h
  resync_interval: 24h   # re-read the whole span; past hours never change, this only drops deleted rows
  query_timeout: 1m
  # After each quota fetch, read what sub2api logged for the account since its
  # 5h and weekly windows started (llm_quota_window_consumed), for the quota
  # capacity estimate. One indexed query per fetch.
  quota_windows: true
